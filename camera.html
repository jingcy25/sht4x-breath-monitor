<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>摄像头 · 躺/坐识别</title>
<style>
  :root{--bg:#090D11;--panel:#0F161D;--line:rgba(255,255,255,.08);--ink:#E9EFF4;--muted:#8A99A7;--jade:#3DDC97;--amber:#F2B441;--coral:#FF6B6B;--mono:"IBM Plex Mono",Consolas,monospace;--sans:"PingFang SC","Microsoft YaHei",sans-serif}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);padding:22px 22px 40px}
  .shell{max-width:1100px;margin:0 auto}
  .top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
  h1{font-size:20px;margin:0} .sub{font-size:12px;color:var(--muted);margin-top:4px}
  a{color:var(--jade);text-decoration:none;font-size:13px}
  .grid{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}
  @media(max-width:900px){.grid{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px}
  .card h2{font-size:12px;color:var(--muted);font-weight:600;margin:0 0 12px;letter-spacing:.02em}
  .stream{width:100%;border-radius:12px;background:#000;display:block;min-height:240px;object-fit:contain}
  .pose{width:100%;max-width:420px;border-radius:12px;background:#000;display:block;margin:0 auto}
  .row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:0}
  .k{font-size:12px;color:var(--muted)}
  .v{font-family:var(--mono);font-size:26px;font-weight:500}
  .v.ok{color:var(--jade)} .v.warn{color:var(--amber)} .v.bad{color:var(--coral)}
  .pill{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 10px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--amber)}
  .dot.live{background:var(--jade);animation:pulse 1.8s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(61,220,151,.45)}70%{box-shadow:0 0 0 7px rgba(61,220,151,0)}100%{box-shadow:0 0 0 0 rgba(61,220,151,0)}}
  .hint{font-size:12px;color:var(--muted);line-height:1.6;margin-top:10px}
  #status{font-size:13px;color:var(--amber);min-height:20px;margin-top:8px}
</style>
</head>
<body>
<div class="shell">
  <div class="top">
    <div>
      <h1>摄像头 · 躺/坐识别</h1>
      <div class="sub">Teachable Machine Pose（Sit / Lie）· 浏览器端推理 · 结果回传 A 层</div>
    </div>
    <div style="display:flex;gap:10px;align-items:center">
      <span class="pill"><span class="dot" id="dot"></span><span id="src">初始化</span></span>
      <a href="/">← 返回仪表盘</a>
    </div>
  </div>

  <div class="grid">
    <div class="card">
      <h2>Pi 摄像头（MJPEG）</h2>
      <img id="stream" class="stream" src="/video_feed" alt="Pi camera stream">
      <div class="hint">页面打开期间每秒约 2 次推理；关闭页面后 A 层把摄像头视为 <code>unknown</code>，只用 FSR + 光照。</div>
    </div>

    <div class="card">
      <h2>识别结果</h2>
      <div class="row"><span class="k">姿势</span><span class="v ok" id="posture">--</span></div>
      <div class="row"><span class="k">置信度</span><span class="v" id="conf">--</span></div>
      <div class="row"><span class="k">推理延迟</span><span class="v" id="latency">--</span></div>
      <canvas id="canvas" class="pose" width="257" height="257"></canvas>
      <div id="status">正在加载模型…</div>
    </div>
  </div>
</div>

<script src="/static/js/tf.min.js"></script>
<script src="/static/js/teachablemachine-pose.min.js"></script>
<script>
(function(){
  "use strict";
  const $ = id => document.getElementById(id);
  const stream = $("stream");
  const canvas = $("canvas");
  const ctx = canvas.getContext("2d");
  const SIZE = 257;

  let model = null;
  let running = true;
  let inferring = false;
  let lastInfer = 0;
  let lastSent = 0;
  let lastStatus = "";

  function setStatus(text, color) {
    if (text === lastStatus) return;
    lastStatus = text;
    $("status").textContent = text;
    $("status").style.color = color || "var(--amber)";
  }
  function setLive(on) {
    $("dot").classList.toggle("live", !!on);
    $("src").textContent = on ? "实时" : "未连接";
  }

  async function init() {
    try {
      setStatus("加载模型 /static/pose_model …");
      model = await tmPose.load("/static/pose_model/model.json", "/static/pose_model/metadata.json");
      setStatus("模型已加载，等待摄像头画面…", "var(--jade)");
      setLive(true);
      requestAnimationFrame(loop);
    } catch (err) {
      console.error(err);
      setStatus("模型加载失败：" + (err && err.message ? err.message : err), "var(--coral)");
      setLive(false);
    }
  }

  function loop(ts) {
    if (!running) return;
    if (stream.complete && stream.naturalWidth > 0) {
      ctx.drawImage(stream, 0, 0, SIZE, SIZE);
      if (model && !inferring && ts - lastInfer > 500) {
        lastInfer = ts;
        infer();
      }
    }
    requestAnimationFrame(loop);
  }

  async function infer() {
    inferring = true;
    const t0 = performance.now();
    try {
      const { pose, posenetOutput } = await model.estimatePose(canvas);
      const preds = await model.predict(posenetOutput);
      let best = preds[0] || { className: "unknown", probability: 0 };
      for (const p of preds) if (p.probability > best.probability) best = p;

      const raw = String(best.className || "").toLowerCase();
      let posture = "unknown";
      if (raw.startsWith("s")) posture = "sitting";
      else if (raw.startsWith("l")) posture = "lying";
      const conf = Number(best.probability || 0);
      if (conf < 0.60) posture = "unknown";

      $("posture").textContent = posture === "sitting" ? "坐起" : posture === "lying" ? "躺下" : "未知";
      $("posture").className = "v " + (posture === "unknown" ? "warn" : "ok");
      $("conf").textContent = (conf * 100).toFixed(1) + "%";
      $("latency").textContent = Math.round(performance.now() - t0) + " ms";

      if (pose && pose.keypoints) drawPose(pose);

      const now = Date.now();
      if (now - lastSent > 450) {
        lastSent = now;
        fetch("/api/camera", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ posture, confidence: conf, t: now / 1000 })
        }).catch(() => {});
      }
    } catch (err) {
      console.error(err);
      setStatus("推理失败：" + (err && err.message ? err.message : err), "var(--coral)");
    } finally {
      inferring = false;
    }
  }

  function drawPose(pose) {
    try {
      const minPartConfidence = 0.4;
      tmPose.drawKeypoints(pose.keypoints, minPartConfidence, ctx);
      tmPose.drawSkeleton(pose.keypoints, minPartConfidence, ctx);
    } catch (e) {}
  }

  stream.addEventListener("error", () => {
    setStatus("摄像头流不可用（检查 /dev/video0 或 USB hub）", "var(--coral)");
    setLive(false);
  });
  stream.addEventListener("load", () => setStatus("摄像头已连接", "var(--jade)"));

  init();
})();
</script>
</body>
</html>
